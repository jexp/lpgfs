id: "segfault-investigation-001"
title: "Fix segmentation fault on mount"
description: |
  Segmentation fault occurs when mounting LPGFS. Root causes:
  - fuse-native 2.2.6 compatibility issues with Node.js 22
  - macFUSE initialization errors not handled properly
  - Signal handlers accessing unmounted FUSE
  - Missing graceful degradation for FUSE errors
completed: false
---

id: "task-segfault-001"
title: "Add comprehensive FUSE error handling in daemon"
description: |
  Daemon currently crashes with segfault when FUSE operations fail.

  **What to do:**
  - Wrap all fuse.mount() and FUSE operation callbacks with try-catch
  - Add null checks before accessing this.fuse in signal handlers
  - Check daemon state before calling stop() in signal handlers
  - Add timeout to mount operation (fail after 5s instead of hanging)
  - Log detailed errors from fuse-native callbacks
  - Ensure cleanup() never throws exceptions

  **Files:**
  - src/core/daemon.ts (lines 272-280, 395-415)

  **Acceptance criteria:**
  - No segfaults when FUSE fails to initialize
  - Proper error messages instead of crashes
  - Signal handlers don't cause crashes when FUSE not mounted
  - npm run tsc passes

  **Test:**
  - Try mounting with wrong permissions
  - Send SIGINT before mount completes
  - Kill Neo4j during startup

parentID: "segfault-investigation-001"
dependsOn: []
completed: false
---

id: "task-segfault-002"
title: "Add Node.js version check and warning"
description: |
  fuse-native may not be stable on Node.js 22. Add runtime version check.

  **What to do:**
  - Check process.version in Daemon.start()
  - Log warning if Node.js > 20 (fuse-native tested up to Node 20)
  - Suggest downgrading to Node 18 or 20 for stability
  - Don't block execution, just warn user

  **Files:**
  - src/core/daemon.ts (add check before loadFuse())

  **Acceptance criteria:**
  - Warning logged when running on Node 22+
  - Message includes: "fuse-native may be unstable on Node.js 22, consider Node 18 or 20"
  - Doesn't prevent mounting (just warns)
  - npm run tsc passes

parentID: "segfault-investigation-001"
dependsOn: ["task-segfault-001"]
completed: false
