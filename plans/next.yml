id: "task-segfault-003"
title: "Add FUSE library validation checks"
description: |
  Validate macFUSE is properly installed before attempting mount.

  **What to do:**
  - Check for /Library/Filesystems/macfuse.fs on macOS
  - Check for /dev/fuse on Linux
  - Add validateFuseLibraries() method to Daemon class
  - Call validation before creating FUSE instance
  - Provide platform-specific installation instructions

  **Files:**
  - src/core/daemon.ts (add validateFuseLibraries() method)

  **Acceptance criteria:**
  - Clear error if macFUSE not installed: "macFUSE not found. Install from https://osxfuse.github.io/"
  - Clear error on Linux if /dev/fuse missing
  - Validation runs before fuse-native module is loaded
  - npm run tsc passes

  **Notes:**
  - macFUSE path: /Library/Filesystems/macfuse.fs
  - Linux device: /dev/fuse

parentID: "segfault-investigation-001"
dependsOn: ["task-segfault-001"]
completed: false
