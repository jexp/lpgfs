id: "task-segfault-004"
title: "Add graceful FUSE operations error handling"
description: |
  FUSE operation callbacks may throw errors causing segfault.

  **What to do:**
  - Wrap all FUSE operation implementations in createFuseOps() with try-catch
  - Specifically wrap: init, open, opendir, release, releasedir callbacks
  - Log errors and return appropriate POSIX error codes instead of crashing
  - Never throw synchronous errors from FUSE callbacks
  - Always call callback exactly once (even on error)

  **Files:**
  - src/core/daemon.ts (lines 448-643, createFuseOps method)

  **Acceptance criteria:**
  - No uncaught exceptions from FUSE callbacks
  - All callbacks return error codes instead of throwing
  - Logger captures all FUSE operation errors
  - npm run tsc passes

  **Test:**
  - Mount and immediately send invalid operations
  - Unmount while operations in progress

parentID: "segfault-investigation-001"
dependsOn: ["task-segfault-001"]
completed: false
---

id: "task-segfault-005"
title: "Add process.on('uncaughtException') handler"
description: |
  Catch any remaining segfault-causing exceptions for debugging.

  **What to do:**
  - Add process.on('uncaughtException') handler in Daemon.start()
  - Log full error stack trace with context (state, mountpoint, etc)
  - Attempt graceful cleanup before exit
  - Store handler reference for cleanup in stop()

  **Files:**
  - src/core/daemon.ts (register in start(), unregister in cleanup())

  **Acceptance criteria:**
  - Uncaught exceptions logged with full context
  - Cleanup attempted before process exits
  - Handler removed during normal stop() flow
  - npm run tsc passes

  **Notes:**
  - Don't swallow exceptions - log and exit with code 1
  - Include daemon state in error log

