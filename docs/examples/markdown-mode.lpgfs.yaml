# Example .lpgfs.yaml for markdown mode.
#
# This is the exact configuration test/fixtures/odyssey/ was rendered
# against (see test/fixtures/odyssey/README.md) -- copy it as .lpgfs.yaml
# next to a `lpgfs mount` invocation (or pass --config) to reproduce that
# fixture vault from test/fixtures/odyssey/import.cypher, or adapt the
# `naming`/`mode.markdown` sections to your own graph's labels.

naming:
  default: elementId
  overrides:
    nodes:
      Character: { property: name }
      Place: { property: name }
      Creature: { property: name }
      Event: { property: name }

sanitization:
  replace:
    "/": "_"
    "\\": "_"
    "\0": "_"
    ":": "_"
    "*": "_"
    "?": "_"
    '"': "_"
    "<": "_"
    ">": "_"
    "|": "_"

collision:
  strategy: suffix_elementId

mode:
  type: markdown
  markdown:
    # Unset (or []) renders every label; set explicitly here so labels
    # outside this list (e.g. a secondary "Hero" label) never mount their
    # own top-level directory.
    labels: [Character, Place, Creature, Event]

    # 'wikilink' (default): quoted Obsidian-native "[[Label/name]]" links.
    linkStyle: wikilink

    # Render incoming relationships under `in_<TYPE>` frontmatter keys.
    includeIncoming: false

    # Node properties composing the markdown body, in order.
    textProperties:
      default: [summary, text, content]

    # Ordered fallback lists mapped to the canonical OKF frontmatter keys.
    fields:
      title: [title, name]
      timestamp: [updated, lastUpdated, modified, created]
      tags: [tags, categories]
