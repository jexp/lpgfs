      - task-006
      - task-018
    acceptance_criteria:
      - "readdir on root lists one entry per rendered label (index.md/log.md/config-file listing deferred to task-019, since generating them depends on task-011/task-012)"
      - "getattr on a node's .md file reports size equal to the exact rendered byte length"
      - "read on a node's .md file returns the same content used to compute its getattr size, without re-rendering twice"
      - "All write FUSE operations continue returning EROFS in markdown mode"
      - "Handler unit tests cover classic mode being unaffected and markdown mode's readdir/getattr/read/write paths"
    status: completed
    completed_at: "2026-07-22T22:15:00Z"

