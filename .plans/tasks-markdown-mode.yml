tasks:
  - id: task-001
    title: "Extend ConfigSchema and parser with the mode section"
    description: |
      Add `mode.type: classic | markdown` and the full `mode.markdown` sub-schema
      (labels, linkStyle, includeIncoming, textProperties default/overrides,
      fields default/overrides for title/timestamp/tags) to src/types/index.ts
      and validate/merge it in src/config/parser.ts, following the existing
      validateNaming/validateSanitization patterns. Default mode.type is
      'classic' so existing behavior and config files are unaffected.
    status: completed
    completed_at: 2026-07-22T18:50:12Z
    dependencies: []
    acceptance_criteria:
      - "ConfigSchema type includes a mode field with classic as the default when omitted"
      - "ConfigParser.validate rejects invalid mode.type, linkStyle, or malformed textProperties/fields shapes with ConfigValidationError"
      - "ConfigParser.parse on an empty or classic-only config produces identical output to current behavior (regression-safe)"
      - "Unit tests cover valid markdown mode configs, missing sections falling back to defaults, and each validation error path"

  - id: task-002
    title: "Add --mode CLI flag and wire MountOptions"
    description: |
      Add a --mode <classic|markdown> flag to the mount command in
      src/cli/index.ts, extend MountOptions/DEFAULT_MOUNT_OPTIONS in
      src/types/index.ts, and ensure the CLI flag overrides the config
      file's mode.type when both are present.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "lpgfs mount --mode markdown overrides mode.type from .lpgfs.yaml"
      - "Omitting --mode preserves the config file's mode.type (or classic default)"
      - "Invalid --mode values are rejected with a clear CLI error"
      - "CLI unit tests cover flag parsing and precedence over config file"
    completed_at: 2026-07-22T19:15:54Z

  - id: task-003
    title: "Add Obsidian-illegal character sanitization and reserved-name suffixing"
    description: |
      Extend src/config/sanitize.ts so that in markdown mode the default
      replacement map additionally covers [, ], #, ^, | and so that any
      sanitized node name equal to 'index' or 'log' gets a collision-style
      suffix, keeping those two filenames reserved for generated bundle files.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "Sanitizing a name containing [, ], #, ^, or | replaces them per the extended map only when mode is markdown"
      - "A node whose sanitized name is exactly 'index' or 'log' is suffixed using the existing collision strategy"
      - "Classic mode sanitization behavior is unchanged"
      - "Unit tests cover each newly sanitized character and both reserved names"
    completed_at: "2026-07-22T21:00:00Z"

  - id: task-004
    title: "Build the markdown-mode path parser"
    description: |
      Add a mode-aware path parser (new module or extension of
      src/core/path-parser.ts) that recognizes markdown-mode paths:
      root, /<Label>, /<Label>/<name>.md, /index.md, /log.md, and
      /<Label>/index.md. Strips the .md extension before node lookup and
      returns ENOENT for any deeper or malformed path.
    status: completed
    completed_at: 2026-07-22T19:35:31Z
    dependencies:
      - task-001
      - task-003
    acceptance_criteria:
      - "Parsing /<Label>/<name>.md yields a node PathContext with label and stripped name"
      - "Parsing /index.md, /log.md, and /<Label>/index.md yields distinct generated-file PathContext variants"
      - "Paths deeper than /<Label>/<name>.md return ENOENT"
      - "Unit tests cover root, label, node file, both generated-file types, and invalid paths"

  - id: task-005
    title: "Implement the pure markdown renderer for a single node"
    description: |
      Create src/markdown/renderer.ts exporting a pure function that takes
      resolved properties, relationships, and the markdown mode config and
      returns the full markdown string for one node: type key first, then
      mapped fields, then remaining properties alphabetical (YAML via the
      existing yaml dependency), then per-rel-type frontmatter link keys
      (wikilink or markdown link style, alphabetical target order), then the
      concatenated text body with ## headings when multiple sections are
      present.
    status: completed
    completed_at: 2026-07-22T19:03:37Z
    dependencies:
      - task-001
    acceptance_criteria:
      - "Frontmatter key order is deterministic: type, mapped fields, remaining properties (alphabetical), relationship keys (alphabetical)"
      - "linkStyle: wikilink emits quoted \"[[Label/name]]\"; linkStyle: markdown emits /Label/name.md"
      - "Body renders bare for a single present text property and with ## headings for multiple"
      - "A node with no configured text properties present renders frontmatter-only with an empty body"
      - "Unit tests cover Neo4j Integer/Float/temporal/point property serialization, list properties, and incoming-link (in_<TYPE>) rendering when enabled"

  - id: task-006
    title: "Implement title/timestamp/tags field-mapping resolver"
    description: |
      Add a resolver (e.g. src/markdown/fields.ts) implementing the
      per-field ordered fallback lookup described in REQ-F-050/051/052:
      for each of title, timestamp, tags, pick the first property present
      on the node from the configured (or default) fallback list, omit the
      source property from remaining frontmatter, serialize timestamp as
      ISO 8601 and coerce scalar tags to a single-item list. Design the
      resolver behind a small interface so a future CypherFieldResolver can
      be substituted without changing the renderer (per Future Extensions).
    status: completed
    completed_at: "2026-07-22T21:40:00Z"
    dependencies:
      - task-005
    acceptance_criteria:
      - "A node with 'updated' and a node with only 'lastUpdated' both resolve to the same canonical timestamp key"
      - "The source property used for a mapped field is not duplicated elsewhere in frontmatter"
      - "A node matching none of a field's fallbacks omits that canonical key entirely"
      - "A scalar tags value becomes a single-item YAML list; setting a field's fallback list to [] disables that mapping"
      - "Resolver is invoked through an interface the renderer depends on, not a hardcoded property lookup"

  - id: task-018
    title: "Add single-query node+relationships fetch for markdown rendering"
    description: |
      Add a new query in src/db/queries.ts (e.g. getNodeForMarkdown) that
      fetches a node's properties, labels, and all relationships (both
      directions, every type) in exactly one Cypher round trip, per
      REQ-F-032/REQ-NF-002 — using a COLLECT { } subquery per direction (or
      an equivalent pattern-comprehension form, whichever profiles better)
      rather than the existing separate getNodeProperties + getRelationships
      pair. Do NOT group, sort, or resolve target naming in Cypher: return
      raw (relType, direction, targetLabels, targetElementId, targetProps)
      tuples and do all grouping-by-type and target label/name sorting in
      TypeScript, reusing the existing naming-strategy resolution logic
      client-side for target names. Keep the query itself simple and
      profile it (EXPLAIN/PROFILE) against a reasonably branching test node
      before finalizing the exact Cypher form.
    status: completed
    dependencies:
      - task-001
    acceptance_criteria:
      - "A single Cypher query returns a node's properties, labels, and every relationship (both directions, all types) with no per-relationship-type follow-up queries"
      - "Grouping by relationship type/direction and sorting targets by label/name happens in TypeScript, not in the Cypher query"
      - "Target naming-strategy resolution (elementId vs. property, per-label overrides) is applied client-side from the returned targetLabels/targetProps/targetElementId"
      - "Query is validated with EXPLAIN/PROFILE against a fixture node with multiple relationship types/directions and documented as reasonably efficient (no unnecessary cartesian products or full scans)"
      - "Unit tests cover a node with no relationships, one-directional-only relationships, and multiple relationship types in both directions"
      - "Integration test against a live Docker Neo4j instance (via neo4j-cli) verifies the query against real data, not just mocked driver responses"
    completed_at: "2026-07-22T19:50:30Z"

